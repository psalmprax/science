[package]
name = "apedp-vqc"
version = "0.1.0"
edition = "2021"
description = "Native Clifford / stabilizer execution core for APEDP-VQC"
license = "MIT"

[lib]
name = "apedp_vqc"
# cdylib is the Python extension module maturin links. rlib is kept so
# `cargo test --no-default-features` can exercise the Pauli algebra, the
# stabilizer tableau and the equivalence images without a Python interpreter.
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
# PyO3 is opt-in so the pure-Rust core is testable on its own. Turning it off
# also removes the linked-but-unused-here Python symbols from a test binary.
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
