# mypy config for the jax-aware CI job (typecheck-neural).
#
# Unlike the default config in pyproject.toml, this file has NO override for
# apedp.neural_discovery.*, so the neural stack is fully checked. It requires
# jax + the neural extras to be installed (pip install -e ".[dev,bayesian,neural]").
#
# Status: advisory (continue-on-error in CI) while the neural stack carries
# ~152 typing errors. Flip the CI job to blocking once it reaches zero.

[mypy]
python_version = 3.12
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
files = apedp
