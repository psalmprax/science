[workspace]
# The kernel crate lives at rust/apedp-kernel. This manifest previously
# pointed at "crates/apedp_kernel", which exists in neither the path or the
# directory name, so cargo refused to build the real crate at all while the
# workspace claim was in effect:
#
#   current package believes it's in a workspace when it's not
#
# Release profile note: cargo honours [profile.*] only at the workspace
# root. While the settings lived in rust/apedp-kernel/Cargo.toml they were
# ignored under a workspace, so the optimized cdylib that maturin links
# against would silently lose opt-level/lto. They live here now.
members = [
    "rust/apedp-kernel",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
