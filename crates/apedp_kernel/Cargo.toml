[package]
name = "apedp_kernel"
version = "0.1.0"
edition = "2021"
authors = ["APEDP Team"]
description = "High-performance Rust numerical and validation kernel for APEDP"

[lib]
name = "apedp_kernel"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module"] }
numpy = "0.30.0"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
faer = "0.24.4"
dashu = "0.6.1"

[dev-dependencies]
approx = "0.5"
