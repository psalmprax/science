name: Feature request
description: Suggest a focused improvement or capability.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What need or limitation would this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior or outcome you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
      description: Note other approaches, constraints, or compatibility concerns.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add relevant examples, references, or related issues.
    validations:
      required: false
