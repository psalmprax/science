name: Video flow head-to-head, JetFlow against flow matching and MeanFlow

# PREREG-VIDEO-FLOW-2026-11 (preregistration/PREREG-VIDEO-FLOW-2026-11.md), on the owner's word of 26 November ("yes
# build it"). scripts/run_prereg_video_flow.py trains one arm of packages/jetflow-video/jetflow_video/head_to_head.py
# on one data set with one seed per runner (four arms, one of them a hybrid; three data sets; three seeds), then generates 256 clips with
# each sampler of the arm's grid and scores them against held-out real clips. The final run checks the digest first.
#   push to video-flow-smoke-*  -> a rehearsal on the development splits: 120 s of training, 64 clips per sampler.
#   push to video-flow-run-*    -> the preregistered run, once: 1,200 s of training, 256 clips per sampler.
# Branch pushes start it because workflow_dispatch only reaches the default branch.

on:
  push:
    branches: ['video-flow-run-*', 'video-flow-smoke-*']

permissions:
  contents: read

jobs:
  job:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {data: 'fluid', arm: 'fm-jetflow', seed: 0}
          - {data: 'fluid', arm: 'fm-jetflow', seed: 1}
          - {data: 'fluid', arm: 'fm-jetflow', seed: 2}
          - {data: 'fluid', arm: 'fm-unet', seed: 0}
          - {data: 'fluid', arm: 'fm-unet', seed: 1}
          - {data: 'fluid', arm: 'fm-unet', seed: 2}
          - {data: 'fluid', arm: 'meanflow-unet', seed: 0}
          - {data: 'fluid', arm: 'meanflow-unet', seed: 1}
          - {data: 'fluid', arm: 'meanflow-unet', seed: 2}
          - {data: 'collision', arm: 'fm-jetflow', seed: 0}
          - {data: 'collision', arm: 'fm-jetflow', seed: 1}
          - {data: 'collision', arm: 'fm-jetflow', seed: 2}
          - {data: 'collision', arm: 'fm-unet', seed: 0}
          - {data: 'collision', arm: 'fm-unet', seed: 1}
          - {data: 'collision', arm: 'fm-unet', seed: 2}
          - {data: 'collision', arm: 'meanflow-unet', seed: 0}
          - {data: 'collision', arm: 'meanflow-unet', seed: 1}
          - {data: 'collision', arm: 'meanflow-unet', seed: 2}
          - {data: 'ucf101', arm: 'fm-jetflow', seed: 0}
          - {data: 'ucf101', arm: 'fm-jetflow', seed: 1}
          - {data: 'ucf101', arm: 'fm-jetflow', seed: 2}
          - {data: 'ucf101', arm: 'fm-unet', seed: 0}
          - {data: 'ucf101', arm: 'fm-unet', seed: 1}
          - {data: 'ucf101', arm: 'fm-unet', seed: 2}
          - {data: 'ucf101', arm: 'meanflow-unet', seed: 0}
          - {data: 'ucf101', arm: 'meanflow-unet', seed: 1}
          - {data: 'ucf101', arm: 'meanflow-unet', seed: 2}
          - {data: 'fluid', arm: 'meanflow-jetflow', seed: 0}
          - {data: 'fluid', arm: 'meanflow-jetflow', seed: 1}
          - {data: 'fluid', arm: 'meanflow-jetflow', seed: 2}
          - {data: 'collision', arm: 'meanflow-jetflow', seed: 0}
          - {data: 'collision', arm: 'meanflow-jetflow', seed: 1}
          - {data: 'collision', arm: 'meanflow-jetflow', seed: 2}
          - {data: 'ucf101', arm: 'meanflow-jetflow', seed: 0}
          - {data: 'ucf101', arm: 'meanflow-jetflow', seed: 1}
          - {data: 'ucf101', arm: 'meanflow-jetflow', seed: 2}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,test]" opencv-python-headless huggingface_hub
      - name: The comparison's own tests
        run: python -m pytest tests/test_video_flow_head_to_head.py -q
      - name: Train and score ${{ matrix.data }} ${{ matrix.arm }} seed ${{ matrix.seed }}
        timeout-minutes: 70
        env:
          DATA: ${{ matrix.data }}
          ARM: ${{ matrix.arm }}
          SEED: ${{ matrix.seed }}
          REF: ${{ github.ref_name }}
        run: |
          if [[ "$REF" == video-flow-run-* ]]; then
            python scripts/run_prereg_video_flow.py job --data "$DATA" --arm "$ARM" --seed "$SEED" --mode final --out out
          else
            python scripts/run_prereg_video_flow.py job --data "$DATA" --arm "$ARM" --seed "$SEED" --mode dev --seconds 120 --n-gen 64 --out out
          fi
      - name: Print the job's record
        if: always()
        run: |
          echo "=====BEGIN video flow job====="
          for f in out/job_*.json; do [ -f "$f" ] && gzip -9c "$f" | base64 -w 60000; echo; done
          echo "=====END video flow job====="
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: video-flow-${{ strategy.job-index }}
          path: out

  collect:
    needs: job
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,test]" opencv-python-headless huggingface_hub tqdm
      - uses: actions/download-artifact@v8
        with:
          pattern: video-flow-*
          path: got
          merge-multiple: true
      - name: Collect
        env:
          REF: ${{ github.ref_name }}
        run: |
          if [[ "$REF" == video-flow-run-* ]]; then MODE=final; else MODE=dev; fi
          python scripts/run_prereg_video_flow.py collect --mode "$MODE" --out got
      - name: Print the record
        if: always()
        run: |
          echo "=====BEGIN video flow====="
          if [ -f got/results.json ]; then gzip -9c got/results.json | base64 -w 60000; echo; fi
          echo "=====END video flow====="
