name: Docker image builds

# The image was unbuildable for weeks and nobody saw it (outside audit of 27 November 2026): the builder stage
# lacked the workspace manifest and lock file, and the only job that builds the image (`build` in test.yml) waits
# for the trustees' signature and for a branch named `main` that this repository does not have. This check builds
# the image and starts it, and pushes nothing. It runs only when a file the image is built from changes.

on:
  push:
    branches: [stage, master]
    paths:
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust/apedp-kernel/**'
      - '.github/workflows/docker-build-check.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust/apedp-kernel/**'
      - '.github/workflows/docker-build-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: The image builds and starts (nothing is pushed)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image without pushing it
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: apedp:check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image starts and answers its health check
        run: |
          docker run -d --name apedp-check -p 8000:8000 -e APEDP_API_KEY=only-for-this-check apedp:check
          ok=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then ok=1; break; fi
            sleep 2
          done
          docker logs apedp-check 2>&1 | tail -30
          test "$ok" = "1"
