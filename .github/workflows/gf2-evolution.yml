name: GF(2^n) decompositions, a language model evolves the construction (development)

# Development, not a result: scripts/run_gf2_evolution.py lets a model rewrite construct(n, modulus, seconds), a program
# that builds bilinear decompositions of GF(2^n) multiplication, under a fixed judge that checks every entry for
# GF(2^5) .. GF(2^10) and GF(2^12) (AlphaEvolve-style, with apedp_dyn.evolution's restricted language and jail).
#   push to gf2-evolution-run-*  -> tests, the seed scored, the loop with a scripted stand-in (no model), then the loop
#                                    with a real model, capped at 120 model calls.
# The key is the repository secret NVIDIA_API_KEY (or CODING_MODEL_API_KEY with the variable CODING_MODEL); only the
# step that talks to the model is given it, and code a model wrote runs in a process given none of the job's
# environment. Owner's word of 26 November ("build and test all 4"); the first runs stay at a few hundred calls.
# Branch pushes start it because workflow_dispatch only reaches the default branch.

on:
  push:
    branches: ['gf2-evolution-run-*']

permissions:
  contents: read

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,test]"
      - name: The loop's own tests
        run: python -m pytest tests/test_run_gf2_evolution.py tests/test_evolution.py -q
      - name: The seed, no model
        run: python scripts/run_gf2_evolution.py baseline --out evolution/baseline
      - name: The loop with a scripted stand-in, no model
        run: python scripts/run_gf2_evolution.py demo --out evolution/demo --field-seconds 5
      - name: The loop with a model, at most 120 calls
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CODING_MODEL_API_KEY: ${{ secrets.CODING_MODEL_API_KEY }}
          CODING_MODEL: ${{ vars.CODING_MODEL }}
          CODING_MODEL_BASE_URL: ${{ vars.CODING_MODEL_BASE_URL }}
        run: python scripts/run_gf2_evolution.py evolve --out evolution/model --steps 40 --repairs 2 --max-calls 120 --seconds 15000
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gf2-evolution
          path: evolution
      - name: Print the record
        if: always()
        run: |
          echo "=====BEGIN gf2 evolution====="
          if [ -f evolution/model/gf2_evolution.json ]; then gzip -9c evolution/model/gf2_evolution.json | base64 -w 60000; echo; fi
          echo "=====END gf2 evolution====="
          echo "=====BEGIN gf2 evolution baseline====="
          if [ -f evolution/baseline/gf2_evolution.json ]; then gzip -9c evolution/baseline/gf2_evolution.json | base64 -w 60000; echo; fi
          echo "=====END gf2 evolution baseline====="
