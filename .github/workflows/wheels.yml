name: Cross-Platform Native Wheels

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    paths:
      - 'rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'packages/**'
      - '.github/workflows/wheels.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-wheels:
    name: Linux Wheels (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up QEMU for multi-arch
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: docker/setup-qemu-action@v3

      - name: Build manylinux wheels
        uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: '1.99.0'
          maturin-version: '1.14.1'
          target: ${{ matrix.target }}
          args: --release --locked --find-interpreter --out dist --manifest-path rust/apedp-kernel/Cargo.toml
          manylinux: auto

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist/*.whl

  macos-wheels:
    name: macOS Wheels (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build macOS wheels
        uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: '1.99.0'
          maturin-version: '1.14.1'
          target: ${{ matrix.target }}
          args: --release --locked --out dist --manifest-path rust/apedp-kernel/Cargo.toml

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/*.whl

  windows-wheels:
    name: Windows Wheels (x86_64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Windows wheels
        uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: '1.99.0'
          maturin-version: '1.14.1'
          target: x86_64-pc-windows-msvc
          args: --release --locked --out dist --manifest-path rust/apedp-kernel/Cargo.toml

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x86_64
          path: dist/*.whl

  sdist:
    name: Build source distribution (sdist)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: '1.99.0'
          maturin-version: '1.14.1'
          command: sdist
          args: --out dist --manifest-path rust/apedp-kernel/Cargo.toml

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*

  python-packages:
    name: Python Subpackage Wheels (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        package:
          - apedp-continuum
          - apedp-quantum
          - apedp-robotics
          - apedp-molecular
          - apedp-audio
          - apedp-distributed
          - jetflow-video
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheel and sdist
        working-directory: packages/${{ matrix.package }}
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Verify packaging contract (apedp core dependency)
        working-directory: packages/${{ matrix.package }}
        run: |
          python - <<'PY'
          import glob
          import os
          import zipfile

          wheel = sorted(glob.glob("dist/*.whl"))[0]
          with zipfile.ZipFile(wheel) as zf:
              meta_name = next(n for n in zf.namelist() if n.endswith("METADATA"))
              text = zf.read(meta_name).decode("utf-8")
          pkg = os.path.basename(os.getcwd())
          requires_apedp = "Requires-Dist: apedp" in text
          if pkg == "jetflow-video":
              assert not requires_apedp, "jetflow-video must stay fully standalone"
          else:
              assert requires_apedp, f"{pkg} must declare the apedp core dependency"
          print(f"OK: {wheel} metadata satisfies the packaging contract")
          PY

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: pywheels-${{ matrix.package }}
          path: packages/${{ matrix.package }}/dist/*
