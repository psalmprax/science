name: Cross-Platform Native Wheels

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    paths:
      - 'rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'packages/**'
      - '.github/workflows/wheels.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-wheels:
    name: Linux Wheels (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up QEMU for multi-arch
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: docker/setup-qemu-action@v4

      - name: Build manylinux wheels
        uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: '1.99.0'
          maturin-version: '1.14.1'
          target: ${{ matrix.target }}
          args: --release --locked --find-interpreter --out dist --manifest-path rust/apedp-kernel/Cargo.toml
          manylinux: auto

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist/*.whl

  macos-wheels:
    name: macOS Wheels (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          # macos-15, not macos-14: GitHub retired the macOS 14 images on
          # 2026-11-02. From then on this job was cancelled before any step
          # ran ("The configuration 'macos-14-arm64-us-default' is not
          # supported"), so no arm64 macOS wheel was built or checked.
          - target: aarch64-apple-darwin
            runner: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build macOS wheels
        uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: '1.99.0'
          maturin-version: '1.14.1'
          target: ${{ matrix.target }}
          args: --release --locked --out dist --manifest-path rust/apedp-kernel/Cargo.toml

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/*.whl

  windows-wheels:
    name: Windows Wheels (x86_64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build Windows wheels
        uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: '1.99.0'
          maturin-version: '1.14.1'
          target: x86_64-pc-windows-msvc
          args: --release --locked --out dist --manifest-path rust/apedp-kernel/Cargo.toml

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x86_64
          path: dist/*.whl

  sdist:
    name: Build source distribution (sdist)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: '1.99.0'
          maturin-version: '1.14.1'
          command: sdist
          args: --out dist --manifest-path rust/apedp-kernel/Cargo.toml

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*

  python-packages:
    name: Python Subpackage Wheels (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        package:
          - jetflow-video
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build wheel and sdist
        working-directory: packages/${{ matrix.package }}
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Verify jetflow-video stays standalone
        working-directory: packages/${{ matrix.package }}
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = sorted(glob.glob("dist/*.whl"))[0]
          with zipfile.ZipFile(wheel) as zf:
              names = zf.namelist()
              meta_name = next(n for n in names if n.endswith("METADATA"))
              text = zf.read(meta_name).decode("utf-8")
              modules = {n: zf.read(n).decode("utf-8") for n in names if n.endswith(".py")}
          assert "Requires-Dist: apedp" not in text, (
              "jetflow-video is standalone by contract: it must not depend on apedp"
          )
          # The declared dependencies are not the whole contract: no module the wheel
          # ships may import the core either. The comparison harness of the preregistered
          # video runs does (inside one function) and is frozen in the source tree, so
          # setup.py leaves it out of the wheel; check that it did.
          assert modules, "the wheel ships no Python modules"
          assert not any(n.endswith("/head_to_head.py") for n in modules), (
              "the frozen comparison harness must not ship in the wheel (setup.py, NOT_SHIPPED)"
          )
          for name, source in modules.items():
              for line in source.splitlines():
                  stripped = line.strip()
                  if stripped.startswith(("import ", "from ")):
                      module = stripped.split()[1].split(".")[0].split(",")[0]
                      assert module not in {"apedp", "apedp_dyn"}, (
                          f"jetflow-video is standalone by contract: {name} imports {module}"
                      )
          print(f"OK: {wheel} is standalone as contracted ({len(modules)} modules)")
          PY

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: pywheels-${{ matrix.package }}
          path: packages/${{ matrix.package }}/dist/*
