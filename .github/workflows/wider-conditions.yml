name: Wider conditions for the table route (development)

# Development, not a result: scripts/run_wider_conditions.py runs the product's own table reading, with
# the search stage in force, on invented laws of three, four and five inputs at noise of 1 to 20 %.
# The route's reports were measured up to three inputs and 5 % noise; this counts what it does beyond.
# Started by pushing a branch wider-conditions-run-*, or wider-conditions-warm-run-* for the same 120 tables with
# kept search processes (apedp_dyn/proposers/warm_pool.py): the full run the owner's decision 2 of 25 November asks
# for before kept processes are proposed as the default (docs/OWNER_DECISIONS_2026-11-25_AFTERNOON.md).

on:
  push:
    branches: ['wider-conditions-run-*', 'wider-conditions-warm-run-*']

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        # eight shards of 15 readings: with four, a shard of 30 readings was still running after 4 h 40 min
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies and PySR
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,test]" pysr==2.7.2
      - name: Shard ${{ matrix.shard }} of 8
        timeout-minutes: 320
        env:
          SHARD: ${{ matrix.shard }}
          # The same searches, with search processes that cannot hang while leaving and a wait for them that
          # is bounded from outside. The first run of this workflow (45444150935) stopped for ever in every
          # shard after one to four searches.
          APEDP_SEARCH_PROCESSES: ${{ startsWith(github.ref_name, 'wider-conditions-warm-run-') && 'warm' || 'leave_hard' }}
        run: python scripts/run_wider_conditions.py run --out out --searches 90 --shard "$SHARD" --shards 8
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wider-conditions-${{ matrix.shard }}
          path: out

  collect:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,test]"
      - uses: actions/download-artifact@v8
        with:
          pattern: wider-conditions-*
          path: got
          merge-multiple: true
      - name: Collect
        run: python scripts/run_wider_conditions.py collect --out got
      - name: Print the record
        if: always()
        run: |
          echo "=====BEGIN wider conditions====="
          if [ -f got/wider_conditions.json ]; then gzip -9c got/wider_conditions.json | base64 -w 0; echo; fi
          echo "=====END wider conditions====="
