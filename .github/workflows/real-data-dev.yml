name: Real measurements, development tables (development)

# Development, not a result: scripts/run_real_data.py on the three development tables of
# benchmarks/real_data/registry.json, with the search stage in force. No held-back table is read:
# they are not in the repository and the loader refuses them. Started by pushing a branch
# real-data-dev-run-*; a branch with "small" in its name runs the small-table reading only.

on:
  push:
    branches: ['real-data-dev-run-*']

permissions:
  contents: read

jobs:
  dev:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies and PySR
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,test]" pysr==2.7.2
      - name: The small-table reading on the development tables, with the searches
        run: python scripts/run_real_data.py small --out out --searches 90
      - name: The route on the development tables, four searches for 90 s
        if: ${{ !contains(github.ref_name, 'small') }}
        run: python scripts/run_real_data.py dev --out out --searches 90
      - name: Print the record
        if: always()
        run: |
          echo "=====BEGIN real data small====="
          if [ -f out/real_data_small.json ]; then gzip -9c out/real_data_small.json | base64 -w 0; echo; fi
          echo "=====END real data small====="
          echo "=====BEGIN real data dev====="
          if [ -f out/real_data_dev.json ]; then gzip -9c out/real_data_dev.json | base64 -w 0; echo; fi
          echo "=====END real data dev====="
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: real-data-dev
          path: out
