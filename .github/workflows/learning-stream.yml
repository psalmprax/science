name: Learning loop stream (development)

# Development, not a result: the learning loop (apedp_dyn/discovery_l2/learning_loop.py) over a stream of
# new laws with the default four searches beside its memory, learning and frozen arms from the same state,
# starting from the memory in force and from an empty one. Started by pushing a branch learning-stream-run-*.

on:
  push:
    branches: ['learning-stream-run-*']

permissions:
  contents: read

jobs:
  arm:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        arm: [learning, frozen]
        memory: [recorded, empty]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies and PySR
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,test]" pysr==2.7.2
      - name: Tests of the loop
        run: python -m pytest -q -p no:warnings tests/test_learning_loop.py
      - name: Stream, ${{ matrix.arm }} arm, ${{ matrix.memory }} memory
        env:
          ARM: ${{ matrix.arm }}
          MEMORY: ${{ matrix.memory }}
        run: |
          EXTRA=""
          if [ "$MEMORY" = "empty" ]; then EXTRA="--empty-memory"; fi
          python scripts/run_learning_stream.py run --laws 30 --arm "$ARM" --searches 150 --memory-seconds 60 --out stream-out $EXTRA
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: learning-stream-${{ matrix.arm }}-${{ matrix.memory }}
          path: stream-out/*.json*
          if-no-files-found: error

  collect:
    needs: arm
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,test]"
      - uses: actions/download-artifact@v8
        with:
          pattern: learning-stream-*
          path: stream-out
          merge-multiple: true
      - name: Collect
        run: python scripts/run_learning_stream.py collect --laws 30 --out stream-out
      - name: Print the results for rebuilding from the log
        run: |
          cd stream-out
          find . -type f | sort | xargs sha256sum
          echo "=====BEGIN-TAR====="
          tar -cf - . | gzip -9 | base64 -w 120
          echo "=====END-TAR====="
