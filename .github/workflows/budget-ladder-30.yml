# The rung the ladder did not have: 30 seconds a search, which is what the dashboard's switch asks for.
# The budget ladder (budget-ladder.yml) ran 90 seconds, 15 minutes and 2 hours; 90 seconds was the budget of the
# measurements and is not a budget of the product (docs/OWNER_DECISIONS_2026-11-25_AFTERNOON.md, correction to
# section 2). This reads the same 40 tables (three and four inputs, noise 1 and 5 %) with 30 seconds a search and
# fresh processes, to be set beside the ladder's 90-second rung. Development only: nothing was fixed beforehand.
#   push to budget-ladder-30-run-*  -> four shards, then one record.
# Branch pushes start it because workflow_dispatch only reaches the default branch.
name: Budget ladder, the dashboard's 30 seconds (development)

on:
  push:
    branches: ['budget-ladder-30-run-*']

permissions:
  contents: read

jobs:
  rung:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies and PySR
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,test]" pysr==2.7.2
      - name: 30 seconds a search, shard ${{ matrix.shard }} of 4
        timeout-minutes: 160
        env:
          SHARD: ${{ matrix.shard }}
        run: >
          python scripts/run_wider_conditions.py run --out out --searches 30
          --inputs 3,4 --noises 0.01,0.05 --shard "$SHARD" --shards 4
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ladder-cold-30-${{ matrix.shard }}
          path: out

  collect:
    needs: rung
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,test]"
      - uses: actions/download-artifact@v8
        with:
          pattern: ladder-cold-30-*
          path: got
          merge-multiple: true
      - name: Collect and print
        run: |
          python scripts/run_wider_conditions.py collect --out got > /dev/null || true
          echo "=====BEGIN ladder cold-30====="
          if [ -f got/wider_conditions.json ]; then gzip -9c got/wider_conditions.json | base64 -w 60000; echo; fi
          echo "=====END ladder cold-30====="
