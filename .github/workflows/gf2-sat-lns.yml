name: GF(2^12) below 42, large-neighbourhood SAT (development)

# Development, not a result: scripts/search_gf2_sat_lns.py frees k products of a decomposition and asks CryptoMiniSat
# for k - 1 with the same sum (after Heule, Kauers and Seidl, SAT 2019; streamlining: symmetric products), from the
# repository's 42, the GF(4)-type 42s and towers; GF(2^7) to GF(2^9) as calibration. Every shorter decomposition is checked
# against every entry of its tensor before anything is counted. Owner's word of 26 November ("build and test all 4").
#   push to gf2-sat-lns-run-*  -> 9 jobs of four searches of 16500 seconds, then one record.
# Branch pushes start it because workflow_dispatch only reaches the default branch.

on:
  push:
    branches: ['gf2-sat-lns-run-*']

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: 'f12-ref-sym', field: 12, starts: 'ref ref ref ref', kind: random, sym: '--symmetric', k: '7 8', limit: 600}
          - {name: 'f12-ref-blocks', field: 12, starts: 'ref ref ref ref', kind: blocks, sym: '--symmetric', k: '7 8 9', limit: 600}
          - {name: 'f12-gf4-sym', field: 12, starts: 'gf4:0 gf4:1 gf4:2 gf4:3', kind: random, sym: '--symmetric', k: '7 8', limit: 600}
          - {name: 'f12-gf4-blocks', field: 12, starts: 'gf4:0 gf4:1 gf4:4 gf4:5', kind: blocks, sym: '--symmetric', k: '6 9', limit: 600}
          - {name: 'f12-t8-sym', field: 12, starts: 'tower:3:0 tower:3:50 tower:3:100 tower:3:150', kind: random, sym: '--symmetric', k: '7 8', limit: 600}
          - {name: 'f12-gen', field: 12, starts: 'ref gf4:0 gf4:1 tower:3:0', kind: random, sym: '', k: '5 6', limit: 600}
          - {name: 'cal9', field: 9, starts: 'tower:3:0 tower:3:50 tower:3:100 tower:3:200', kind: random, sym: '--symmetric', k: '7 8', limit: 600}
          - {name: 'cal8', field: 8, starts: 'tower:4:0 tower:4:1 tower:4:2 tower:4:3', kind: random, sym: '--symmetric', k: '7 8', limit: 600}
          - {name: 'cal7', field: 7, starts: 'schoolbook schoolbook schoolbook schoolbook', kind: random, sym: '--symmetric', k: '6 7 8', limit: 300}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,test]"
          python -m pip install pycryptosat
      - name: The search's own tests
        run: python -m pytest tests/test_search_gf2_sat_lns.py -q
      - name: Search ${{ matrix.name }}
        timeout-minutes: 310
        env:
          FIELD: ${{ matrix.field }}
          STARTS: ${{ matrix.starts }}
          KIND: ${{ matrix.kind }}
          SYM: ${{ matrix.sym }}
          KS: ${{ matrix.k }}
          LIMIT: ${{ matrix.limit }}
        run: |
          seed=0
          for s in $STARTS; do
            # shellcheck disable=SC2086
            python scripts/search_gf2_sat_lns.py run --field "$FIELD" --start "$s" --kind "$KIND" $SYM --k $KS \
              --trials 100000 --limit "$LIMIT" --budget 16500 --seed "$seed" --out out > "log_$seed.txt" 2>&1 &
            seed=$((seed + 1))
          done
          wait
          tail -n 3 log_*.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gf2-sat-${{ matrix.name }}
          path: out

  collect:
    needs: search
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,test]"
          python -m pip install pycryptosat
      - uses: actions/download-artifact@v8
        with:
          pattern: gf2-sat-*
          path: got
          merge-multiple: true
      - name: Collect
        run: python scripts/search_gf2_sat_lns.py collect --out got
      - name: Print the record
        if: always()
        run: |
          echo "=====BEGIN gf2 sat lns====="
          if [ -f got/sat_lns.json ]; then gzip -9c got/sat_lns.json | base64 -w 60000; echo; fi
          echo "=====END gf2 sat lns====="
