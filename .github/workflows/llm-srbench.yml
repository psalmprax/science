# LLM-SRBench, a benchmark built so that known equations cannot be recited.
#   push to llm-srbench-probe-*  -> print what the dataset contains (read-only)
# Branch pushes start it because workflow_dispatch only reaches the default branch.
name: LLM-SRBench

on:
  workflow_dispatch:
  push:
    branches: ['llm-srbench-probe-*']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install what the probe needs
        run: python -m pip install huggingface_hub pandas pyarrow h5py
      - name: What the dataset contains
        run: python scripts/probe_llm_srbench.py
