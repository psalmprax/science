name: Video hybrid, MeanFlow on JetFlow's network against its parents, larger

# PREREG-VIDEO-HYBRID-2026-11 (preregistration/PREREG-VIDEO-HYBRID-2026-11.md), on the owner's word of 27 November ("go
# ahead to test all"): the larger test RESULT-VIDEO-FLOW-2026-11 proposed for its hybrid. scripts/run_prereg_video_hybrid.py
# sets 8 frames of 32 x 32 and JetFlow's network 64 wide, trains one arm on one data set with one seed per runner (the
# hybrid, its two parents and plain flow matching; three data sets; three seeds), then generates 256 clips per sampler.
#   push to video-hybrid-smoke-*  -> a rehearsal on the development splits: 240 s of training, 64 clips per sampler.
#   push to video-hybrid-run-*    -> the preregistered run, once: 2,700 s of training, 256 clips per sampler.
# Branch pushes start it because workflow_dispatch only reaches the default branch.

on:
  push:
    branches: ['video-hybrid-run-*', 'video-hybrid-smoke-*']

permissions:
  contents: read

jobs:
  job:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      # Seed by seed, then data set, then arm: the four arms of one data set and seed are a block of four, so at
      # 20 jobs at a time no block is split between the first jobs to start and the rest.
      max-parallel: 20
      matrix:
        include:
          - {data: 'fluid', arm: 'meanflow-jetflow', seed: 0}
          - {data: 'fluid', arm: 'meanflow-unet', seed: 0}
          - {data: 'fluid', arm: 'fm-jetflow', seed: 0}
          - {data: 'fluid', arm: 'fm-unet', seed: 0}
          - {data: 'collision', arm: 'meanflow-jetflow', seed: 0}
          - {data: 'collision', arm: 'meanflow-unet', seed: 0}
          - {data: 'collision', arm: 'fm-jetflow', seed: 0}
          - {data: 'collision', arm: 'fm-unet', seed: 0}
          - {data: 'ucf101', arm: 'meanflow-jetflow', seed: 0}
          - {data: 'ucf101', arm: 'meanflow-unet', seed: 0}
          - {data: 'ucf101', arm: 'fm-jetflow', seed: 0}
          - {data: 'ucf101', arm: 'fm-unet', seed: 0}
          - {data: 'fluid', arm: 'meanflow-jetflow', seed: 1}
          - {data: 'fluid', arm: 'meanflow-unet', seed: 1}
          - {data: 'fluid', arm: 'fm-jetflow', seed: 1}
          - {data: 'fluid', arm: 'fm-unet', seed: 1}
          - {data: 'collision', arm: 'meanflow-jetflow', seed: 1}
          - {data: 'collision', arm: 'meanflow-unet', seed: 1}
          - {data: 'collision', arm: 'fm-jetflow', seed: 1}
          - {data: 'collision', arm: 'fm-unet', seed: 1}
          - {data: 'ucf101', arm: 'meanflow-jetflow', seed: 1}
          - {data: 'ucf101', arm: 'meanflow-unet', seed: 1}
          - {data: 'ucf101', arm: 'fm-jetflow', seed: 1}
          - {data: 'ucf101', arm: 'fm-unet', seed: 1}
          - {data: 'fluid', arm: 'meanflow-jetflow', seed: 2}
          - {data: 'fluid', arm: 'meanflow-unet', seed: 2}
          - {data: 'fluid', arm: 'fm-jetflow', seed: 2}
          - {data: 'fluid', arm: 'fm-unet', seed: 2}
          - {data: 'collision', arm: 'meanflow-jetflow', seed: 2}
          - {data: 'collision', arm: 'meanflow-unet', seed: 2}
          - {data: 'collision', arm: 'fm-jetflow', seed: 2}
          - {data: 'collision', arm: 'fm-unet', seed: 2}
          - {data: 'ucf101', arm: 'meanflow-jetflow', seed: 2}
          - {data: 'ucf101', arm: 'meanflow-unet', seed: 2}
          - {data: 'ucf101', arm: 'fm-jetflow', seed: 2}
          - {data: 'ucf101', arm: 'fm-unet', seed: 2}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,test]" numpy==2.5.5 opencv-python-headless==5.1.0.95 huggingface_hub==2.5.0
      - name: The comparison's own tests
        run: python -m pytest tests/test_video_hybrid_prereg.py -q
      - name: Train and score ${{ matrix.data }} ${{ matrix.arm }} seed ${{ matrix.seed }}
        timeout-minutes: 120
        env:
          DATA: ${{ matrix.data }}
          ARM: ${{ matrix.arm }}
          SEED: ${{ matrix.seed }}
          REF: ${{ github.ref_name }}
        run: |
          if [[ "$REF" == video-hybrid-run-* ]]; then
            python scripts/run_prereg_video_hybrid.py job --data "$DATA" --arm "$ARM" --seed "$SEED" --mode final --out out
          else
            python scripts/run_prereg_video_hybrid.py job --data "$DATA" --arm "$ARM" --seed "$SEED" --mode dev --seconds 240 --n-gen 64 --out out
          fi
      - name: Print the job's record
        if: always()
        run: |
          echo "=====BEGIN video hybrid job====="
          for f in out/job_*.json; do [ -f "$f" ] && gzip -9c "$f" | base64 -w 60000; echo; done
          echo "=====END video hybrid job====="
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: video-hybrid-${{ strategy.job-index }}
          path: out

  collect:
    needs: job
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,test]" numpy==2.5.5 opencv-python-headless==5.1.0.95 huggingface_hub==2.5.0 tqdm
      - uses: actions/download-artifact@v8
        with:
          pattern: video-hybrid-*
          path: got
          merge-multiple: true
      - name: Collect
        env:
          REF: ${{ github.ref_name }}
        run: |
          if [[ "$REF" == video-hybrid-run-* ]]; then MODE=final; else MODE=dev; fi
          python scripts/run_prereg_video_hybrid.py collect --mode "$MODE" --out got
      - name: Print the record
        if: always()
        run: |
          echo "=====BEGIN video hybrid====="
          if [ -f got/results.json ]; then gzip -9c got/results.json | base64 -w 60000; echo; fi
          echo "=====END video hybrid====="
