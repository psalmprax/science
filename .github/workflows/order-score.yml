# Where the true law lands in the memory's proposals, as the memory is taught more laws
# (scripts/measure_order_score.py; the measurement is apedp_dyn/recursion/order_score.py).
# Development only: nothing was fixed beforehand, no held-back law is read, no search engine is run.
#   push to order-score-run-*        -> every arm on its shards over the 300 test problems, then one record.
#   push to order-score-fresh-run-*  -> three arms over the second set: 200 problems drawn with another seed,
#                                       none with the structure of a problem of the first set or of a law taught.
#   push to order-score-split-run-*  -> the second set again, the list built as a proposer can build it
#                                       (fitted on four fifths of the rows, read on the fifth set aside).
#   push to order-score-split-first-run-*  -> the first set with the list built that way, to learn an order from.
#   push to order-score-in-force-first-run-* / order-score-in-force-fresh-run-*  -> the memory in force for tables
#                                       listed as a proposer can list it, on the first set (to learn its order from)
#                                       and on the second (to score that order), for the referee test of the ranked
#                                       proposer (docs/OWNER_DECISIONS_2026-11-25_AFTERNOON.md, 1).
# Branch pushes start it because workflow_dispatch only reaches the default branch.
name: Order score of the memory's proposals (development)

on:
  push:
    branches: ['order-score-run-*', 'order-score-fresh-run-*', 'order-score-split-run-*', 'order-score-split-first-run-*',
               'order-score-in-force-first-run-*', 'order-score-in-force-fresh-run-*']

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      set: ${{ steps.pick.outputs.set }}
      arms: ${{ steps.pick.outputs.arms }}
    steps:
      - id: pick
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$BRANCH" in
            order-score-fresh-run-*)
              echo 'set=fresh' >> "$GITHUB_OUTPUT"
              echo 'arms=["taught-20","taught-80","taught-320"]' >> "$GITHUB_OUTPUT" ;;
            order-score-split-first-run-*)
              echo 'set=test' >> "$GITHUB_OUTPUT"
              echo 'arms=["split-80"]' >> "$GITHUB_OUTPUT" ;;
            order-score-in-force-first-run-*)
              echo 'set=test' >> "$GITHUB_OUTPUT"
              echo 'arms=["split-in-force"]' >> "$GITHUB_OUTPUT" ;;
            order-score-in-force-fresh-run-*)
              echo 'set=fresh' >> "$GITHUB_OUTPUT"
              echo 'arms=["in-force","split-in-force"]' >> "$GITHUB_OUTPUT" ;;
            order-score-split-run-*)
              echo 'set=fresh' >> "$GITHUB_OUTPUT"
              echo 'arms=["split-80"]' >> "$GITHUB_OUTPUT" ;;
            *)
              echo 'set=test' >> "$GITHUB_OUTPUT"
              echo 'arms=["taught-0","taught-5","taught-20","taught-80","taught-320","in-force"]' >> "$GITHUB_OUTPUT" ;;
          esac

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arm: ${{ fromJSON(needs.plan.outputs.arms) }}
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,test]"
      - name: ${{ matrix.arm }}, shard ${{ matrix.shard }} of 2
        env:
          ARM: ${{ matrix.arm }}
          SHARD: ${{ matrix.shard }}
          PROBLEM_SET: ${{ needs.plan.outputs.set }}
        run: python scripts/measure_order_score.py run --out out --arm "$ARM" --shard "$SHARD" --shards 2 --set "$PROBLEM_SET"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: order-score-${{ matrix.arm }}-${{ matrix.shard }}
          path: out

  collect:
    needs: [plan, run]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,test]"
      - uses: actions/download-artifact@v8
        with:
          pattern: order-score-*
          path: got
          merge-multiple: true
      - name: Collect
        env:
          PROBLEM_SET: ${{ needs.plan.outputs.set }}
        run: python scripts/measure_order_score.py collect --out got --set "${PROBLEM_SET:-test}"
      - name: Print the record
        if: always()
        run: |
          echo "=====BEGIN order score====="
          if [ -f got/order_score.json ]; then gzip -9c got/order_score.json | base64 -w 60000; echo; fi
          echo "=====END order score====="
          echo "=====BEGIN order score pools====="
          if [ -f got/order_score_pools.json.gz ]; then base64 -w 60000 got/order_score_pools.json.gz; echo; fi
          echo "=====END order score pools====="
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: order-score-record
          path: |
            got/order_score.json
            got/order_score_rows.jsonl.gz
            got/order_score_pools.json.gz
