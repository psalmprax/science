name: Physics judge, development runs on PhysInOne

# docs/PLAN_PHYSICS_VIDEO_STEP1_2026-11-26.md, part 1a, on the owner's word of 26 November ("so, build").
# One runner per scene kind: scripts/run_physics_judge_dev.py reads the masks of 30 development scenes (60 for collisions, most are not side views) of
# the kind's phenomenon from PhysInOne on the Hugging Face Hub (range requests, nothing kept), makes the
# object tracks, and prints the judge's verdicts on the true clips and on four development perturbations
# between markers in the log (verdicts, reasons and scene names; no tracks: the licence, and the repository is public). Development pool only: the blind pool (backgrounds that are
# multiples of five) is refused by the script.
#   push to physics-judge-dev-*  -> one development run.
# Branch pushes start it because workflow_dispatch only reaches the default branch.

on:
  push:
    branches: ['physics-judge-dev-*']

permissions:
  contents: read

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kind: [free_fall, throw, roll, bounce, pendulum, collision]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev,test]" huggingface_hub
      - name: The judge's own tests
        run: python -m pytest tests/test_physics_judge.py -q
      - name: Fetch tracks for ${{ matrix.kind }}
        timeout-minutes: 35
        env:
          KIND: ${{ matrix.kind }}
        run: |
          COUNT=30; if [ "$KIND" = collision ]; then COUNT=60; fi
          python scripts/run_physics_judge_dev.py fetch --kind "$KIND" --count "$COUNT" --seed 0 --pool dev --out "tracks_$KIND.json"
      - name: Judge ${{ matrix.kind }}
        timeout-minutes: 20
        env:
          KIND: ${{ matrix.kind }}
        run: python scripts/run_physics_judge_dev.py judge --tracks "tracks_$KIND.json" --out "verdicts_$KIND.json"
      - name: Print the record
        if: always()
        env:
          KIND: ${{ matrix.kind }}
        run: |
          python - <<'EOF'
          import json, os, pathlib
          kind = os.environ["KIND"]
          rec = {}
          # Verdicts, reasons and scene names only: PhysInOne is CC BY-NC-SA 4.0 and this repository is public, so
          # no track (and no statistic of one) is printed. Until 27 November the tracks were printed too.
          p = pathlib.Path(f"verdicts_{kind}.json")
          if p.exists():
              data = json.loads(p.read_text())
              rows = [{k: r.get(k) for k in ("scene", "variant", "outcome", "reasons")} for r in data["rows"]]
              rec["verdicts"] = {"kind": data["kind"], "rows": rows}
          pathlib.Path("record.json").write_text(json.dumps(rec))
          EOF
          echo "=====BEGIN physics judge ${KIND}====="
          gzip -9c record.json | base64 -w 60000; echo
          echo "=====END physics judge ${KIND}====="
