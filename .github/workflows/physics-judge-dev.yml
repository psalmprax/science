name: Physics judge, development runs on PhysInOne

# docs/PLAN_PHYSICS_VIDEO_STEP1_2026-11-26.md, part 1a, on the owner's word of 26 November ("so, build").
# One runner per scene kind: scripts/run_physics_judge_dev.py reads the masks of 30 development scenes of
# the kind's phenomenon from PhysInOne on the Hugging Face Hub (range requests, nothing kept), makes the
# object tracks, and prints the judge's verdicts on the true clips and on four development perturbations,
# with the tracks, between markers in the log. Development pool only: the blind pool (backgrounds that are
# multiples of five) is refused by the script.
#   push to physics-judge-dev-*  -> one development run.
# Branch pushes start it because workflow_dispatch only reaches the default branch.

on:
  push:
    branches: ['physics-judge-dev-*']

permissions:
  contents: read

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kind: [free_fall, throw, roll, bounce, pendulum, collision]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev,test]" huggingface_hub
      - name: The judge's own tests
        run: python -m pytest tests/test_physics_judge.py -q
      - name: Fetch tracks for ${{ matrix.kind }}
        timeout-minutes: 35
        env:
          KIND: ${{ matrix.kind }}
        run: python scripts/run_physics_judge_dev.py fetch --kind "$KIND" --count 30 --seed 0 --pool dev --out "tracks_$KIND.json"
      - name: Judge ${{ matrix.kind }}
        timeout-minutes: 20
        env:
          KIND: ${{ matrix.kind }}
        run: python scripts/run_physics_judge_dev.py judge --tracks "tracks_$KIND.json" --out "verdicts_$KIND.json"
      - name: Print the record
        if: always()
        env:
          KIND: ${{ matrix.kind }}
        run: |
          python - <<'EOF'
          import json, os, pathlib
          kind = os.environ["KIND"]
          rec = {}
          for name in (f"tracks_{kind}.json", f"verdicts_{kind}.json"):
              p = pathlib.Path(name)
              if p.exists():
                  rec[name.split("_")[0]] = json.loads(p.read_text())
          pathlib.Path("record.json").write_text(json.dumps(rec))
          EOF
          echo "=====BEGIN physics judge ${KIND}====="
          gzip -9c record.json | base64 -w 60000; echo
          echo "=====END physics judge ${KIND}====="
