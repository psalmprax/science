name: APEDP CI/CD

on:
  push:
    # Every branch is gated, not just the integration branches: work happened
    # on `stage` for an entire session with no CI coverage because it was
    # absent from this list, and a broken tree survived as a result.
    branches: ['**']
  pull_request:
    branches: [master, main, develop, stage]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APEDP_REDIS_URL: redis://localhost:6379/0
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -e ".[dev,test,orchestration]"

      # The native kernel behind `apedp/rust_bridge.py` lives in
      # `rust/apedp-kernel/`. Without it, `is_rust_kernel_available()` is False
      # and the sixteen differential tests in
      # `tests/test_cross_implementation_conformance.py` skip -- green, and
      # checking nothing. So the kernel is built here, and the next step asserts
      # it is actually importable before any test tier runs. A build that stops
      # building fails loudly instead of turning into sixteen skips.
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/apedp-kernel -> target

      - name: Rust kernel unit tests
        run: cargo test --manifest-path rust/apedp-kernel/Cargo.toml

      - name: Build and install the native kernel
        run: |
          source .venv/bin/activate
          pip install "maturin>=1.5,<2.0"
          maturin develop --manifest-path rust/apedp-kernel/Cargo.toml

      # The load-bearing step. If this passes, the conformance suite below runs
      # against a real Rust engine instead of skipping.
      - name: The kernel must be importable (a silent skip is a failure here)
        run: |
          source .venv/bin/activate
          python - <<'PY'
          import apedp_kernel
          from apedp.rust_bridge import is_rust_kernel_available
          assert is_rust_kernel_available(), (
              "apedp_kernel imported but the bridge is not using it; the "
              "differential conformance tests would skip rather than run"
          )
          print("apedp_kernel", apedp_kernel.__version__, "active")
          PY

      # Fast tier first: seconds, not minutes. It parses every source file and
      # imports every apedp_dyn module, so a syntax or import-time break fails
      # in ~2s instead of after a ten-minute suite run. It also imports every
      # test module (collection), which the full run only reaches late.
      - name: Fast smoke tier (syntax + imports)
        run: |
          source .venv/bin/activate
          pytest tests/test_smoke_imports.py -q

      - name: Collection smoke (import every test module)
        run: |
          source .venv/bin/activate
          pytest tests/ --collect-only -q

      - name: Run regression tests
        run: |
          source .venv/bin/activate
          pytest tests/ -v --tb=short -n auto -m "not integration"

      - name: Run live integration tests
        run: |
          source .venv/bin/activate
          pytest tests/ -v --tb=short -n auto -m integration

      # The dynamical package owns the doctrine, so it is gated on its own and
      # kept at zero. These two steps run before the broader apedp/ gates
      # below; all four are blocking.
      - name: Lint apedp_dyn with ruff
        run: |
          source .venv/bin/activate
          ruff check apedp_dyn/

      - name: Type check apedp_dyn with mypy
        run: |
          source .venv/bin/activate
          mypy apedp_dyn/ --ignore-missing-imports

      # Both of these gate. They were annotated as expected failures while
      # the finding count was carried by untracked files from concurrent
      # apedp/apedp_dyn sessions; every finding in a *committed* file is now
      # clear (8c0be24), and CI only ever checks out committed files, so
      # this is a real gate rather than a decoration.
      #
      # The findings that remain locally (~144 ruff, 21 mypy) all live in
      # apedp_dyn/conf/benchmark_v2.py and five apedp_dyn/sandbox/ demos
      # that are not yet in version control. They will surface here the
      # moment they are committed, which is the right time to fix them.
      - name: Lint with ruff
        run: |
          source .venv/bin/activate
          ruff check apedp/ apedp_dyn/ tests/

      - name: Type check with mypy
        run: |
          source .venv/bin/activate
          mypy apedp/ apedp_dyn/ --ignore-missing-imports

      - name: Security scan with bandit
        run: |
          source .venv/bin/activate
          bandit -r apedp/ -ll

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy to Fly.io
        uses: superfly/flyctl-actions@1.4
        with:
          args: "deploy --image ghcr.io/${{ github.repository }}:${{ github.sha }} --app apedp"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Health check deployment
        run: |
          sleep 10
          curl -f https://apedp.fly.dev/health || exit 1

  # ------------------------------------------------------------------
  # Wheel artifacts for the native kernel.
  #
  # `apedp_kernel` is a separate maturin package, so plain `pip install -e .`
  # never produces it: the bridge silently answers every call on the Python
  # reference path and the differential conformance suite skips. This job
  # builds the manylinux wheel on every push/PR and uploads it as a workflow
  # artifact, so users can `pip install` it directly. On a tag push it also
  # publishes to PyPI, but only when a `PYPI_API_TOKEN` secret exists -- until
  # then the artifact upload is the distribution surface.
  # ------------------------------------------------------------------
  build-kernel-wheel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build manylinux wheel (pyo3/maturin container)
        uses: PyO3/maturin-action@v1
        with:
          working-directory: rust/apedp-kernel
          command: build
          args: --release --out ../../wheelhouse --interpreter python3.12

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: apedp_kernel-wheel-${{ github.sha }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish-kernel-wheel:
    needs: build-kernel-wheel
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/') &&
      secrets.PYPI_API_TOKEN != ''
    permissions:
      contents: read
    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: apedp_kernel-wheel-${{ github.sha }}
          path: wheelhouse

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true