name: APEDP CI/CD

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APEDP_REDIS_URL: redis://localhost:6379/0
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -e ".[dev,test,orchestration]"

      # Fast tier first: seconds, not minutes. It parses every source file and
      # imports every apedp_dyn module, so a syntax or import-time break fails
      # in ~2s instead of after a ten-minute suite run. It also imports every
      # test module (collection), which the full run only reaches late.
      - name: Fast smoke tier (syntax + imports)
        run: |
          source .venv/bin/activate
          pytest tests/test_smoke_imports.py -q

      - name: Collection smoke (import every test module)
        run: |
          source .venv/bin/activate
          pytest tests/ --collect-only -q

      - name: Run regression tests
        run: |
          source .venv/bin/activate
          pytest tests/ -v --tb=short -n auto -m "not integration"

      - name: Run live integration tests
        run: |
          source .venv/bin/activate
          pytest tests/ -v --tb=short -n auto -m integration

      # The dynamical package owns the doctrine, so it is gated on its own and
      # kept at zero. These two steps run before the broader apedp/ gates
      # below; all four are blocking.
      - name: Lint apedp_dyn with ruff
        run: |
          source .venv/bin/activate
          ruff check apedp_dyn/

      - name: Type check apedp_dyn with mypy
        run: |
          source .venv/bin/activate
          mypy apedp_dyn/ --ignore-missing-imports

      # Both of these gate. They were annotated as expected failures while
      # the finding count was carried by untracked files from concurrent
      # apedp/apedp_dyn sessions; every finding in a *committed* file is now
      # clear (8c0be24), and CI only ever checks out committed files, so
      # this is a real gate rather than a decoration.
      #
      # The findings that remain locally (~144 ruff, 21 mypy) all live in
      # apedp_dyn/conf/benchmark_v2.py and five apedp_dyn/sandbox/ demos
      # that are not yet in version control. They will surface here the
      # moment they are committed, which is the right time to fix them.
      - name: Lint with ruff
        run: |
          source .venv/bin/activate
          ruff check apedp/ apedp_dyn/ tests/

      - name: Type check with mypy
        run: |
          source .venv/bin/activate
          mypy apedp/ apedp_dyn/ --ignore-missing-imports

      - name: Security scan with bandit
        run: |
          source .venv/bin/activate
          bandit -r apedp/ -ll

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy to Fly.io
        uses: superfly/flyctl-actions@1.4
        with:
          args: "deploy --image ghcr.io/${{ github.repository }}:${{ github.sha }} --app apedp"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Health check deployment
        run: |
          sleep 10
          curl -f https://apedp.fly.dev/health || exit 1