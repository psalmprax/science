# The real PySR through the proposer and the main search path
# (apedp_dyn/proposers/pysr_proposer.py, apedp_dyn/discovery_l2/main_search.py).
# PySR needs Julia, which the ordinary test jobs do not install, so this runs
# on demand: push a branch named main-search-smoke-*.
name: Main search smoke

on:
  workflow_dispatch:
  push:
    branches: ['main-search-smoke-*']

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install PySR
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,test]" pysr==2.7.2
          python -c "import pysr; print('pysr', pysr.__version__)"
      - name: PySR through the proposer and the main search path
        env:
          APEDP_RUN_PYSR: '1'
          APEDP_PYSR_BUDGET_SECONDS: '60'
        run: python -m pytest tests/test_pysr_integration.py -v -s -p no:cacheprovider -o addopts=""
