# What longer searches find: the product's table reading on the same tables with 90 seconds, 15 minutes and
# 2 hours for each search, and with search processes kept warm (scripts/run_wider_conditions.py).
# Development only: nothing was fixed beforehand, no held-back law is read.
#   push to budget-ladder-run-*  -> every rung on its shards, then one record for each rung.
# The tables are those of the wider-conditions runs with three and four inputs: 40 at noise 1 and 5 %
# for the 90-second and 15-minute rungs, the 20 at 1 % for the 2-hour rung.
# Branch pushes start it because workflow_dispatch only reaches the default branch.
name: Budget ladder for the search stage (development)

on:
  push:
    branches: ['budget-ladder-run-*']

permissions:
  contents: read

jobs:
  rung:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - {rung: cold-90, seconds: 90, noises: '0.01,0.05', shards: 4, shard: 0, processes: ''}
          - {rung: cold-90, seconds: 90, noises: '0.01,0.05', shards: 4, shard: 1, processes: ''}
          - {rung: cold-90, seconds: 90, noises: '0.01,0.05', shards: 4, shard: 2, processes: ''}
          - {rung: cold-90, seconds: 90, noises: '0.01,0.05', shards: 4, shard: 3, processes: ''}
          - {rung: warm-90, seconds: 90, noises: '0.01,0.05', shards: 4, shard: 0, processes: warm}
          - {rung: warm-90, seconds: 90, noises: '0.01,0.05', shards: 4, shard: 1, processes: warm}
          - {rung: warm-90, seconds: 90, noises: '0.01,0.05', shards: 4, shard: 2, processes: warm}
          - {rung: warm-90, seconds: 90, noises: '0.01,0.05', shards: 4, shard: 3, processes: warm}
          - {rung: cold-900, seconds: 900, noises: '0.01,0.05', shards: 8, shard: 0, processes: ''}
          - {rung: cold-900, seconds: 900, noises: '0.01,0.05', shards: 8, shard: 1, processes: ''}
          - {rung: cold-900, seconds: 900, noises: '0.01,0.05', shards: 8, shard: 2, processes: ''}
          - {rung: cold-900, seconds: 900, noises: '0.01,0.05', shards: 8, shard: 3, processes: ''}
          - {rung: cold-900, seconds: 900, noises: '0.01,0.05', shards: 8, shard: 4, processes: ''}
          - {rung: cold-900, seconds: 900, noises: '0.01,0.05', shards: 8, shard: 5, processes: ''}
          - {rung: cold-900, seconds: 900, noises: '0.01,0.05', shards: 8, shard: 6, processes: ''}
          - {rung: cold-900, seconds: 900, noises: '0.01,0.05', shards: 8, shard: 7, processes: ''}
          - {rung: cold-7200, seconds: 7200, noises: '0.01', shards: 10, shard: 0, processes: ''}
          - {rung: cold-7200, seconds: 7200, noises: '0.01', shards: 10, shard: 1, processes: ''}
          - {rung: cold-7200, seconds: 7200, noises: '0.01', shards: 10, shard: 2, processes: ''}
          - {rung: cold-7200, seconds: 7200, noises: '0.01', shards: 10, shard: 3, processes: ''}
          - {rung: cold-7200, seconds: 7200, noises: '0.01', shards: 10, shard: 4, processes: ''}
          - {rung: cold-7200, seconds: 7200, noises: '0.01', shards: 10, shard: 5, processes: ''}
          - {rung: cold-7200, seconds: 7200, noises: '0.01', shards: 10, shard: 6, processes: ''}
          - {rung: cold-7200, seconds: 7200, noises: '0.01', shards: 10, shard: 7, processes: ''}
          - {rung: cold-7200, seconds: 7200, noises: '0.01', shards: 10, shard: 8, processes: ''}
          - {rung: cold-7200, seconds: 7200, noises: '0.01', shards: 10, shard: 9, processes: ''}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies and PySR
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,test]" pysr==2.7.2
      - name: ${{ matrix.rung }}, shard ${{ matrix.shard }} of ${{ matrix.shards }}
        timeout-minutes: 320
        env:
          SECONDS_A_SEARCH: ${{ matrix.seconds }}
          NOISES: ${{ matrix.noises }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
          APEDP_SEARCH_PROCESSES: ${{ matrix.processes }}
          # the product's reading allows a search 300 s; this measurement raises the ceiling for its own process
          APEDP_UI_MAX_SEARCH_SECONDS: ${{ matrix.seconds }}
        run: >
          python scripts/run_wider_conditions.py run --out out --searches "$SECONDS_A_SEARCH"
          --inputs 3,4 --noises "$NOISES" --shard "$SHARD" --shards "$SHARDS"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ladder-${{ matrix.rung }}-${{ matrix.shard }}
          path: out

  collect:
    needs: rung
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,test]"
      - uses: actions/download-artifact@v8
        with:
          pattern: ladder-cold-90-*
          path: got/cold-90
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: ladder-warm-90-*
          path: got/warm-90
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: ladder-cold-900-*
          path: got/cold-900
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: ladder-cold-7200-*
          path: got/cold-7200
          merge-multiple: true
      - name: Collect and print each rung
        run: |
          for rung in cold-90 warm-90 cold-900 cold-7200; do
            mkdir -p "got/$rung"
            python scripts/run_wider_conditions.py collect --out "got/$rung" > /dev/null || true
            echo "=====BEGIN ladder $rung====="
            if [ -f "got/$rung/wider_conditions.json" ]; then gzip -9c "got/$rung/wider_conditions.json" | base64 -w 60000; echo; fi
            echo "=====END ladder $rung====="
          done
