[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apedp"
version = "1.0.0"
description = "Autonomous Physics & Engineering Discovery Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "sympy>=1.12",
    "pint>=0.21",
    "pypdf>=3.0",
    "python-docx>=0.8",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "networkx>=3.0",
    "fastapi>=0.140",
    "uvicorn>=0.30",
    "scikit-learn>=1.3",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.1",
    "mypy>=1.5",
    "bandit>=1.7",
    "pytest-xdist>=3.6",
]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "pytest-xdist>=3.6",
]
bayesian = [
    "jax>=0.4",
]

neural = [
    "flax>=0.8",
    "optax>=0.2",
    "equinox>=0.11",      # PyTree-based models
    "blackjax>=1.0",      # MCMC/SVI
    "jaxopt>=0.8",        # Optimization
    "optax>=0.2",         # Optimizers
    "optax-contrib>=0.1", # Extra schedulers
    "opendp>=0.1",        # Differential privacy (optional)
    "optuna>=3.5",        # Hyperopt
]
orchestration = [
    "redis>=5.0",
]

[tool.setuptools.packages.find]
include = ["apedp*"]

[tool.setuptools.package-data]
apedp = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]
markers = [
    "integration: requires an external service such as Redis",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
