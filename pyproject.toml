[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apedp"
version = "1.0.0"
description = "Autonomous Physics & Engineering Discovery Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "sympy>=1.12",
    "pint>=0.21",
    "pypdf>=3.0",
    "python-docx>=0.8",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "networkx>=3.0",
    "fastapi>=0.140",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.1",
    "mypy>=1.5",
    "bandit>=1.7",
]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["apedp*"]

[tool.setuptools.package-data]
apedp = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
